[project]
name = "autonomous-agent"
version = "0.1.0"
description = "FastAPI autonomous document agent backed by Groq structured outputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "groq>=0.30.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = []
